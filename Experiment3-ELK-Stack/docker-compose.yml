version: '3.8'

# =============================================================================
# Docker Compose - ELK Stack (Elasticsearch, Logstash, Kibana)
# DevOps Lab 3 | Student: Kartik Kumar | Roll: 2301730205
# =============================================================================

networks:
  elk_net:
    driver: bridge

volumes:
  elasticsearch_data:
    driver: local
  logstash_data:
    driver: local

services:
  # ============================================================
  # Elasticsearch - Log Storage & Search
  # ============================================================
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.10.0
    container_name: devops3-elasticsearch
    environment:
      - node.name=elasticsearch
      - cluster.name=devops-lab3-cluster
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
      - ELASTIC_PASSWORD=elastic123
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
      - "9300:9300"
    networks:
      - elk_net
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  # ============================================================
  # Logstash - Log Processing Pipeline
  # ============================================================
  logstash:
    image: docker.elastic.co/logstash/logstash:8.10.0
    container_name: devops3-logstash
    environment:
      - "LS_JAVA_OPTS=-Xmx256m -Xms256m"
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline:ro
      - ./logstash/config/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
      - logstash_data:/usr/share/logstash/data
    ports:
      - "5044:5044"   # Beats input
      - "5000:5000"   # TCP input
      - "9600:9600"   # Monitoring API
    networks:
      - elk_net
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped

  # ============================================================
  # Kibana - Log Visualization
  # ============================================================
  kibana:
    image: docker.elastic.co/kibana/kibana:8.10.0
    container_name: devops3-kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - KIBANA_SYSTEM_PASSWORD=kibana123
    ports:
      - "5601:5601"
    networks:
      - elk_net
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:5601/api/status | grep -q 'available'"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ============================================================
  # Filebeat - Log Shipping Agent
  # ============================================================
  filebeat:
    image: docker.elastic.co/beats/filebeat:8.10.0
    container_name: devops3-filebeat
    user: root
    volumes:
      - ./filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./logs:/app-logs:ro
    networks:
      - elk_net
    depends_on:
      - logstash
      - elasticsearch
    restart: unless-stopped

  # ============================================================
  # Log Generator Application
  # ============================================================
  log-generator:
    build:
      context: ./log-generator
      dockerfile: Dockerfile
    container_name: devops3-log-generator
    volumes:
      - ./logs:/app/logs
    networks:
      - elk_net
    environment:
      - STUDENT_NAME=Kartik Kumar
      - ROLL_NUMBER=2301730205
      - LOG_DIR=/app/logs
    restart: unless-stopped

