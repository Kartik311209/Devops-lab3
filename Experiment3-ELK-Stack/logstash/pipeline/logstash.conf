input {
  # Beats input (Filebeat)
  beats {
    port => 5044
    tags => ["beats", "devops-lab3"]
  }

  # TCP input for direct log shipping
  tcp {
    port => 5000
    codec => json_lines
    tags => ["tcp-input", "devops-lab3"]
  }

  # Stdin for testing
  stdin {
    tags => ["stdin"]
  }
}

filter {
  # Parse JSON logs
  if [type] == "app-json" or "beats" in [tags] {
    json {
      source => "message"
      target => "parsed"
      skip_on_invalid_json => true
    }
  }

  # Add student metadata
  mutate {
    add_field => {
      "student_name" => "Kartik Kumar"
      "roll_number" => "2301730205"
      "project" => "devops-lab3"
      "environment" => "development"
    }
  }

  # Parse timestamps
  date {
    match => ["timestamp", "ISO8601", "yyyy-MM-dd HH:mm:ss"]
    target => "@timestamp"
    timezone => "Asia/Kolkata"
  }

  # Grok pattern for access logs
  if [type] == "access_log" {
    grok {
      match => {
        "message" => '%{IPORHOST:remote_addr} - %{USER:remote_user} \[%{HTTPDATE:time_local}\] "%{WORD:method} %{URIPATHPARAM:request} HTTP/%{NUMBER:http_version}" %{NUMBER:status} %{NUMBER:body_bytes_sent} "%{GREEDYDATA:http_referer}" "%{GREEDYDATA:http_user_agent}"'
      }
    }

    # Categorize status codes
    if [status] {
      mutate {
        convert => { "status" => "integer" }
      }
      if [status] >= 500 {
        mutate { add_field => { "log_level" => "ERROR" } }
      } else if [status] >= 400 {
        mutate { add_field => { "log_level" => "WARN" } }
      } else {
        mutate { add_field => { "log_level" => "INFO" } }
      }
    }
  }

  # Drop empty lines
  if [message] =~ /^\s*$/ {
    drop {}
  }
}

output {
  # Send to Elasticsearch
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "devops-lab3-logs-%{+YYYY.MM.dd}"
    document_type => "_doc"
    ilm_enabled => false
  }

  # Debug output (optional)
  stdout {
    codec => rubydebug {
      metadata => false
    }
  }
}

