# =============================================================================
# Prometheus Configuration
# DevOps Lab 3 | Student: Kartik Kumar | Roll: 2301730205
# =============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'devops-lab3-kartik'
    student: 'kartik-kumar'
    roll_number: '2301730205'
    environment: 'development'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

# Load alerting rules
rule_files:
  - "alert.rules.yml"

# Scrape configurations
scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'
          student: 'kartik-kumar'

  # Node Exporter - System metrics
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          service: 'node-exporter'
          instance: 'devops-host'

  # Sample Application
  - job_name: 'sample-app'
    static_configs:
      - targets: ['sample-app:8080']
        labels:
          service: 'web-application'
          student: 'kartik-kumar'
          roll: '2301730205'
    metrics_path: /metrics
    scrape_interval: 10s

  # Docker containers (via cadvisor if available)
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8081']
        labels:
          service: 'docker-containers'
    scrape_interval: 30s

