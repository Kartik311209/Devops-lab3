version: '3.8'

# =============================================================================
# Docker Compose - Prometheus + Grafana Monitoring Stack
# DevOps Lab 3 | Student: Kartik Kumar | Roll: 2301730205
# =============================================================================

networks:
  monitoring_net:
    driver: bridge

volumes:
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

services:
  # ============================================================
  # Sample Application with metrics endpoint
  # ============================================================
  sample-app:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: devops3-kartik-app
    ports:
      - "8080:8080"
    networks:
      - monitoring_net
    environment:
      - STUDENT_NAME=Kartik Kumar
      - ROLL_NUMBER=2301730205
      - PORT=8080
    labels:
      - "project=devops-lab3"
      - "student=kartik-kumar"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================================
  # Node Exporter - System Metrics
  # ============================================================
  node-exporter:
    image: prom/node-exporter:latest
    container_name: devops3-node-exporter
    ports:
      - "9100:9100"
    networks:
      - monitoring_net
    command:
      - '--path.rootfs=/host'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - '/:/host:ro,rslave'
    restart: unless-stopped

  # ============================================================
  # Prometheus - Metrics Collection
  # ============================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: devops3-prometheus
    ports:
      - "9090:9090"
    networks:
      - monitoring_net
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
    restart: unless-stopped
    depends_on:
      - node-exporter
      - sample-app

  # ============================================================
  # Alertmanager
  # ============================================================
  alertmanager:
    image: prom/alertmanager:latest
    container_name: devops3-alertmanager
    ports:
      - "9093:9093"
    networks:
      - monitoring_net
    volumes:
      - ./prometheus/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    restart: unless-stopped

  # ============================================================
  # Grafana - Visualization
  # ============================================================
  grafana:
    image: grafana/grafana:latest
    container_name: devops3-grafana
    ports:
      - "3000:3000"
    networks:
      - monitoring_net
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_DOMAIN=localhost
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource
    restart: unless-stopped
    depends_on:
      - prometheus

