# Docker Compose - Generated by Terraform
# Project: devops-lab3-kartik | Env: development
version: '3.8'

networks:
  devops_network:
    driver: bridge

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:

services:
  webapp:
    image: nginx:alpine
    container_name: devops-lab3-kartik-webapp
    ports:
      - "8080:80"
    networks:
      - devops_network
    labels:
      - "project=devops-lab3-kartik"
      - "student=Kartik Kumar"
      - "roll=2301730205"
    restart: unless-stopped

  database:
    image: postgres:15-alpine
    container_name: devops-lab3-kartik-db
    environment:
      POSTGRES_DB: devopslab3_db
      POSTGRES_USER: devops_user
      POSTGRES_PASSWORD: DevOps@2024
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - devops_network
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: devops-lab3-kartik-prometheus
    ports:
      - "9090:9090"
    networks:
      - devops_network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: devops-lab3-kartik-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin123
    networks:
      - devops_network
    restart: unless-stopped
