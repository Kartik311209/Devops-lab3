name: DevOps Lab 3 - Security Scanning Pipeline
# Student: Kartik Kumar | Roll: 2301730205 | Email: kartikjangra5366@gmail.com

on:
  push:
    branches: [main, develop, 'feature/*']
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 0 * * 1'  # Weekly security scan

env:
  STUDENT_NAME: "Kartik Kumar"
  ROLL_NUMBER: "2301730205"
  PROJECT_NAME: "devops-lab3"
  IMAGE_NAME: "devops-lab3-app"

jobs:
  # ============================================================
  # Static Code Analysis (SAST)
  # ============================================================
  sast-scan:
    name: Static Application Security Testing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install security tools
        run: |
          pip install bandit safety semgrep pylint

      - name: Run Bandit (Python SAST)
        run: |
          echo "Running Bandit security scan..."
          echo "Student: $STUDENT_NAME | Roll: $ROLL_NUMBER"
          bandit -r . -f json -o bandit-results.json --severity-level low || true
          bandit -r . --severity-level medium -f txt || true

      - name: Run Safety (Dependency Check)
        run: |
          echo "Checking Python dependencies for vulnerabilities..."
          safety check --json > safety-results.json || true
          safety check || true

      - name: Run Semgrep (Advanced SAST)
        run: |
          semgrep --config=auto --json -o semgrep-results.json . || true
          semgrep --config=p/security-audit . || true

      - name: Upload SAST Results
        uses: actions/upload-artifact@v3
        with:
          name: sast-results-${{ env.ROLL_NUMBER }}
          path: |
            bandit-results.json
            safety-results.json
            semgrep-results.json

  # ============================================================
  # Dependency Vulnerability Scanning
  # ============================================================
  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Run OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: '${{ env.PROJECT_NAME }}-${{ env.ROLL_NUMBER }}'
          path: '.'
          format: 'HTML'
          out: 'dependency-check-reports'
          args: >
            --enableRetired
            --enableExperimental

      - name: Upload Dependency Check Results
        uses: actions/upload-artifact@v3
        with:
          name: dependency-check-${{ env.ROLL_NUMBER }}
          path: dependency-check-reports/

  # ============================================================
  # Docker Image Security Scan
  # ============================================================
  container-scan:
    name: Container Security Scan
    runs-on: ubuntu-latest
    needs: [sast-scan]
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Build Docker image
        run: |
          docker build -t ${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --label "student=$STUDENT_NAME" \
            --label "roll=$ROLL_NUMBER" \
            ./Experiment2-Prometheus-Grafana/app/

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.IMAGE_NAME }}:${{ github.sha }}'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          output: 'trivy-results.txt'

      - name: Run Trivy (JSON output)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.IMAGE_NAME }}:${{ github.sha }}'
          format: 'json'
          output: 'trivy-results.json'

      - name: Upload Container Scan Results
        uses: actions/upload-artifact@v3
        with:
          name: container-scan-${{ env.ROLL_NUMBER }}
          path: |
            trivy-results.txt
            trivy-results.json

  # ============================================================
  # Secrets Detection
  # ============================================================
  secrets-scan:
    name: Secrets Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Run Gitleaks (secrets detection)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --only-verified

  # ============================================================
  # Infrastructure as Code Security Scan
  # ============================================================
  iac-scan:
    name: Infrastructure Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Run Checkov (IaC security)
        uses: bridgecrewio/checkov-action@master
        with:
          directory: Experiment1-Terraform-Ansible/
          framework: terraform
          output_format: json
          output_file_path: checkov-results.json
          soft_fail: true

      - name: Run tfsec
        uses: aquasecurity/tfsec-action@v1.0.0
        with:
          working_directory: Experiment1-Terraform-Ansible/
          format: json
          soft_fail: true

      - name: Upload IaC Scan Results
        uses: actions/upload-artifact@v3
        with:
          name: iac-scan-${{ env.ROLL_NUMBER }}
          path: |
            checkov-results.json
            tfsec-results.json

  # ============================================================
  # Security Report Generation
  # ============================================================
  security-report:
    name: Generate Security Report
    runs-on: ubuntu-latest
    needs: [sast-scan, dependency-scan, container-scan, secrets-scan, iac-scan]
    if: always()
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v3

      - name: Generate Security Summary
        run: |
          echo "========================================"
          echo "SECURITY SCAN SUMMARY"
          echo "========================================"
          echo "Student    : $STUDENT_NAME"
          echo "Roll       : $ROLL_NUMBER"
          echo "Project    : $PROJECT_NAME"
          echo "Scan Date  : $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "Git SHA    : ${{ github.sha }}"
          echo "Branch     : ${{ github.ref_name }}"
          echo ""
          echo "Scans Completed:"
          echo "  [x] Static Code Analysis (Bandit, Safety, Semgrep)"
          echo "  [x] Dependency Vulnerability Check (OWASP)"
          echo "  [x] Container Image Scan (Trivy)"
          echo "  [x] Secrets Detection (Gitleaks, TruffleHog)"
          echo "  [x] IaC Security Scan (Checkov, tfsec)"
          echo "========================================"

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 🔒 Security Scan Results\n\n**Student:** Kartik Kumar | **Roll:** 2301730205\n\n✅ All security scans completed. See artifacts for detailed reports.`
            })

